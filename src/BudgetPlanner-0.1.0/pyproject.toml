[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-planner"
version = "0.1.0"
description = "CLI budget planner that projects your bank balance from YAML config"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
bp = "bp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
